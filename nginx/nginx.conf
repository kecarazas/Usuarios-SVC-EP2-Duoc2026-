# Balanceador de carga (IE5) delante de las réplicas de usuarios-svc.
# El DNS interno de Docker resuelve "usuarios-svc" a todas las réplicas;
# nginx reparte las peticiones entre ellas (round-robin).
upstream usuarios_backend {
    server usuarios-svc:8080 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://usuarios_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # Si una réplica falla, reintenta en otra.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
